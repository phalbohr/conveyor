board:
  provider: {{provider}}
  project: {{project}}
artifacts:
  idea: {store: board}
  story: {store: board, write: replace}
  plan: {store: board}
pickup_from: plan
language:
  docs: English
transitions:
  idea_to_story: interactive
  story_to_plan: interactive
  merge: human
merge_method: merge
review:
  approvals: 1
defaults: {harness: claude, model: sonnet, effort: medium}
triage: {model: opus, effort: high}
stages:
  story: {model: opus, effort: high}
  plan: {model: opus, effort: high}
  implement: {}
  review: {model: opus, effort: high}
  merge: {model: haiku, effort: low}
hooks:
  timeout: 60s
timeouts:
  stage: 60m
  stall: 5m
  heartbeat: 30m
  waiting: 4d
retry:
  max_backoff: 5m
  max_attempts: 5
harnesses:
  opencode:
    command: opencode
    args: [run, --auto, -m, "{model}", --dir, "{workspace}", "{prompt}"]
    env: {}
    models: {args: [models]}
  pi:
    command: pi
    args: [--mode, json, --model, "{model}", --thinking, "{effort}", --, "{prompt}"]
    env: {}
    models: {args: [--list-models]}
    efforts: [off, minimal, low, medium, high, xhigh, max]
  openhands:
    command: openhands
    args: [--headless, --override-with-envs, --json, -t, "{prompt}"]
    env: {LLM_MODEL: "{model}", OPENHANDS_WORK_DIR: "{workspace}"}
  agent-zero:
    command: a0
    args: [headless, -p, "{prompt}", --output, jsonl, --workspace, "{workspace}"]
    env: {}
